# This file is NOT used by docker-compose. It only defines the local
# Kubernetes cluster that this project monitors (the "patient", not the app itself).
#
# Create the cluster with:
#   kind create cluster --config kind-config.yaml
#
# This is a one-time, manual step, separate from `docker compose up`.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cloudops
nodes:
  - role: control-plane
